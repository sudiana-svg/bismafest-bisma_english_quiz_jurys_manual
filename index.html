<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bisma English Quiz Jury’s Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3FB;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6785;--line:#D3DCEE;--brand:#2F4BDB;--on-brand:#FFFFFF;--gold:#F2B31B;--on-gold:#3B2A00;--x:#2F4BDB;--o:#D6451F;--done:#E3EBF7;
--head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1630;--surface:#17213F;--ink:#EAF0FF;--muted:#A3AFD0;--line:#2A3760;--brand:#7C93FF;--on-brand:#0E1630;--gold:#F6C244;--on-gold:#2B1E00;--x:#8FA3FF;--o:#FF8A66;--done:#1F2B52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1630;--surface:#17213F;--ink:#EAF0FF;--muted:#A3AFD0;--line:#2A3760;--brand:#7C93FF;--on-brand:#0E1630;--gold:#F6C244;--on-gold:#2B1E00;--x:#8FA3FF;--o:#FF8A66;--done:#1F2B52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:24px 18px 36px}
h1{margin:0;font:800 clamp(1.9rem,5vw,3rem)/1.02 var(--head);letter-spacing:-.02em}
h1 span{display:block;font-weight:600;color:var(--brand);font-size:.62em;letter-spacing:0;margin-top:4px}
.lead{margin:10px 0 0;color:var(--muted);max-width:60ch}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:20px 0 16px}
.tab{display:flex;flex-direction:column;text-align:left;padding:12px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;transition:background .15s,border-color .15s}
.tab b{font:800 1.12rem var(--head)}
.tab small{color:var(--muted);font-size:.8rem}
.tab[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tab[aria-selected=true] small{color:inherit;opacity:.85}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px}
.rail{display:flex;flex-wrap:wrap;gap:16px 28px;padding-bottom:16px;margin-bottom:16px;border-bottom:1.5px solid var(--line)}
.lbl{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;padding:7px 14px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;line-height:1.2;transition:background .15s,border-color .15s}
.chip small{font-weight:400;font-size:.74rem;color:var(--muted)}
.chip.lt{width:44px;height:44px;align-items:center;justify-content:center;padding:0}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip.on small{color:inherit;opacity:.85}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:6px}
.bar h2{margin:0;font:800 1.45rem var(--head);margin-right:auto}
.meta{color:var(--muted);font-weight:600}
.ghost{padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:.88rem;font-weight:600}
.ghost:hover{border-color:var(--brand)}
.hint{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.coin{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--on-gold);font:800 1.9rem var(--head);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),inset 0 0 0 7px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:118px;padding:14px;text-align:left;border:1.5px solid var(--line);border-radius:16px;background:var(--surface)}
.card strong{font:800 1.55rem/1.1 var(--head);overflow-wrap:anywhere}
.card em,.qt em{font-style:normal;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--done);padding:2px 9px;border-radius:99px;align-self:flex-start}
.n{position:absolute;top:10px;right:12px;color:var(--muted);font-weight:700;font-size:.85rem}
.done{background:var(--done);opacity:.6}
.done strong,.done .qt,.done .q{text-decoration:line-through}
.list{display:grid;gap:8px}
.row-q{position:relative;display:grid;grid-template-columns:30px 1fr minmax(150px,32%);gap:6px 14px;align-items:center;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px}
.row-q .n{position:static;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--done)}
.qt{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ans{font:800 1.12rem var(--head);color:var(--brand)}
.ans i{font-style:normal;color:var(--muted);margin:0 .35em;font-weight:400}
.hide .ans{filter:blur(8px);user-select:none}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{position:relative;display:flex;flex-direction:column;gap:6px;min-height:156px;padding:12px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);transition:background .15s,border-color .15s}
.cell em{align-self:flex-start;max-width:calc(100% - 34px);font-style:normal;font-size:clamp(.9rem,1.5vw,1.2rem);font-weight:800;line-height:1.2;color:var(--on-gold);background:var(--gold);padding:3px 11px;border-radius:9px}
.cell .q{font-size:.9rem;line-height:1.35;flex:1}
.cell .ans{font-size:1.05rem}
.tag{position:absolute;top:6px;right:11px;font:800 1.7rem var(--head)}
.cell.x{border-color:var(--x);background:color-mix(in srgb,var(--x) 11%,var(--surface))}
.cell.o{border-color:var(--o);background:color-mix(in srgb,var(--o) 11%,var(--surface))}
.cell.x .tag{color:var(--x)}.cell.o .tag{color:var(--o)}
footer{margin-top:18px;text-align:center;color:var(--muted);font-size:.85rem}
@media (max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.row-q{grid-template-columns:30px 1fr}.row-q .ans{grid-column:2}.panel{padding:14px}}
@media (max-width:400px){.board{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html,body{height:100%;overflow:hidden}
.wrap{height:100%;max-width:none;display:flex;flex-direction:column;gap:10px;padding:10px 14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px}
h1{font-size:clamp(1.15rem,2.6vw,1.7rem)}
h1 span{display:inline;font-size:.7em;margin:0 0 0 .4em}
.lead{display:none}
.tabs{margin:0;grid-template-columns:repeat(3,auto);gap:8px}
.tab{padding:7px 14px;border-radius:12px}
.tab b{font-size:1rem}.tab small{font-size:.72rem}
#app{flex:1;min-height:0;display:flex}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px;border-radius:16px;overflow:auto}
.rail{gap:8px 20px;padding-bottom:10px;margin-bottom:10px}
.lbl{margin-bottom:3px;font-size:.78rem}
.chip{padding:4px 11px;border-radius:10px;font-size:.9rem}
.chip.lt{width:34px;height:34px;padding:0}
.bar{margin-bottom:8px;gap:8px 12px}
.bar h2{font-size:1.15rem;margin-right:0}
.hint{margin:0 auto 0 0;font-size:.8rem;color:var(--muted)}
.coin{width:38px;height:38px;font-size:1.3rem;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),inset 0 0 0 5px rgba(0,0,0,.12)}
.grid,.list,.board{flex:1 0 auto;grid-auto-rows:minmax(min-content,1fr)}
.grid{grid-template-columns:repeat(5,1fr);gap:10px}
.list{gap:6px}.board{gap:8px}
.card{min-height:0;padding:10px}
.card strong{font-size:clamp(1.05rem,2.4vw,1.9rem)}
.row-q{padding:4px 12px;min-height:0}
.qt{flex-direction:row;align-items:center;gap:4px 10px;flex-wrap:wrap}
.row-q .q{font-size:clamp(.82rem,1.5vw,1.05rem);line-height:1.25}
.row-q .ans{font-size:clamp(.95rem,1.6vw,1.2rem)}
.cell{min-height:0;padding:8px 10px;gap:3px}
.cell .q{font-size:clamp(.7rem,1.1vw,.88rem);line-height:1.25}
.cell .ans{font-size:clamp(.85rem,1.3vw,1.05rem)}
footer{margin:0;font-size:.72rem;line-height:1}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.hint,.tab small{display:none}.bar h2{margin-right:auto}.tabs{width:100%;grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.panel{background:color-mix(in srgb,var(--brand) 6%,var(--surface))}

:root[data-tab=wg]:not([data-theme=light]){--bg:#0A2827;--surface:#103836;--line:#1F5551;--brand:#5EEAD4;--done:#18504B}

}
:root[data-tab=wg][data-theme=dark]{--bg:#0A2827;--surface:#103836;--line:#1F5551;--brand:#5EEAD4;--done:#18504B}
:root[data-tab=ab][data-theme=dark]{--bg:#2B1F07;--surface:#3A2B0B;--line:#5C4512;--brand:#FBBF24;--done:#4D3910}
:root[data-tab=tt][data-theme=dark]{--bg:#19153D;--surface:#231E54;--line:#3B3482;--brand:#A9A4FF;--done:#302A70}
header .ghost{background:var(--surface)}
</style>

  return `<div class="rail">
    <div><span class="lbl">Word Group</span><div class="row">${D.wg.map((g,i)=>chip(`Group ${i+1}<small>${sum(g.sets,99)} kata</small>`,'g',i,i===S.g)).join('')}</div></div>
    <div><span class="lbl">Set</span><div class="row">${grp.sets.map((s,i)=>{const st=sum(grp.sets,i);return chip(`Set ${i+1}<small>kata ${st+1}–${st+s.length}</small>`,'s',i,i===S.s)}).join('')}</div></div>
  </div>
  <div class="bar"><h2>Word Group ${S.g+1}, Set ${S.s+1}</h2><span class="hint">Klik kartu untuk menandai kata yang sudah dipakai.</span><span class="meta">${done}/${set.length} selesai</span>${reset(pre)}</div>
  <div class="grid">${set.map((x,i)=>`<button class="card${mk(pre+i)?' done':''}" ${b('mark',pre+i)}><span class="n">${sum(grp.sets,S.s)+i+1}</span><strong>${esc(x.w)}</strong><em>${esc(x.c)}</em></button>`).join('')}</div>`;
}

function vAB(){
  const L=D.ab[S.l],set=L.sets[S.as],pre=`ab.${S.l}.${S.as}.`;
  const done=set.filter((_,i)=>mk(pre+i)).length;
  return `<div class="rail">
    <div><span class="lbl">Paket huruf</span><div class="row">${D.ab.map((x,i)=>chip(x.l,'l',i,i===S.l,'lt')).join('')}</div></div>
    <div><span class="lbl">Set</span><div class="row">${L.sets.map((_,i)=>chip(`${L.l}${i+1}`,'as',i,i===S.as)).join('')}</div></div>
  </div>
  <div class="bar"><span class="coin">${L.l}</span><h2>Alphabucks ${L.l}${S.as+1}</h2><span class="hint">Klik soal untuk menandai yang sudah dibacakan.</span><span class="meta">${done}/${set.length} selesai</span>${ansBtn()}${reset(pre)}</div>
  <div class="list${S.ans?'':' hide'}">${set.map((x,i)=>`<button class="row-q${mk(pre+i)?' done':''}" ${b('mark',pre+i)}><span class="n">${i+1}</span><span class="qt"><em>${esc(x.c)}</em><span class="q">${esc(x.q)}</span></span><span class="ans">${x.a.split('/').map(s=>esc(s.trim())).join('<i>/</i>')}</span></button>`).join('')}</div>`;
}

function vTT(){
  const P=D.tt[S.p],pre=`tt.${S.p}.`;let x=0,o=0;
  P.cells.forEach((_,i)=>{const v=mk(pre+i);if(v===1)x++;if(v===2)o++});
  return `<div class="rail"><div><span class="lbl">Paket</span><div class="row">${D.tt.map((p,i)=>chip(i+1,'p',i,i===S.p,'lt')).join('')}</div></div></div>
  <div class="bar"><h2>${esc(P.name)}</h2><span class="hint">Klik kotak untuk menandai: X, lalu O, lalu kosong lagi.</span><span class="meta">X ${x} · O ${o}</span>${ansBtn()}${reset(pre)}</div>
  <div class="board${S.ans?'':' hide'}">${P.cells.map((c,i)=>{const v=mk(pre+i);return `<button class="cell${v===1?' x':v===2?' o':''}" ${b('cyc',pre+i)}><span class="tag">${v===1?'X':v===2?'O':''}</span><em>${esc(c.c)}</em><span class="q">${esc(c.q)}</span><span class="ans">${esc(c.a)}</span></button>`}).join('')}</div>`;
}

const V={wg:vWG,ab:vAB,tt:vTT};
function render(){
  tabsEl.innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${S.tab===t[0]}" ${b('tab',t[0])}><b>${t[1]}</b><small>${t[2]}</small></button>`).join('');
  document.documentElement.dataset.tab=S.tab;
  app.innerHTML=`<section class="panel">${V[S.tab]()}</section>`;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,v=t.dataset.v,n=+v;
  if(a==='tab')S.tab=v;
  else if(a==='g'){S.g=n;S.s=0}
  else if(a==='s')S.s=n;
  else if(a==='l'){S.l=n;S.as=0}
  else if(a==='as')S.as=n;
  else if(a==='p')S.p=n;
  else if(a==='ans')S.ans=!S.ans;
  else if(a==='mark'){S.m[v]=S.m[v]?0:1;save()}
  else if(a==='cyc'){S.m[v]=((S.m[v]||0)+1)%3;save()}
  else if(a==='reset'){Object.keys(S.m).forEach(k=>{if(k.startsWith(v))delete S.m[k]});save()}
  render();
  const nf=document.querySelector(`[data-a="${a}"][data-v="${v}"]`);
  if(nf)nf.focus({preventScroll:true});
});
const fs=document.getElementById('fs');
if(!document.fullscreenEnabled)fs.hidden=true;
fs.addEventListener('click',()=>{
  try{
    const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    if(p&&p.catch)p.catch(()=>{fs.textContent='Tekan F11'});
  }catch(e){fs.textContent='Tekan F11'}
});
document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'Keluar layar penuh':'Layar penuh'});
render();
</script>
</body>
</html>
